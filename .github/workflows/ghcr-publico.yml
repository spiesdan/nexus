name: GHCR — pacotes públicos

# Ferramenta de recuperação: os pacotes que o self-hoster puxa precisam ser
# públicos. Sem isto, `docker pull ghcr.io/spiesdan/nexus:stable` responde
# `unauthorized` numa VPS limpa, e o caminho normal de instalação morre antes
# do primeiro `up`.
#
# O token do `GITHUB_TOKEN` não serve para mudar visibilidade de pacote de
# usuário (os pacotes nasceram vinculados ao fork). Usa o mesmo PAT do
# `publish-image.yml`, que tem `write:packages`.
#
# `workflow_dispatch` de propósito: é ato de manutenção, não de todo push. A
# visibilidade é persistente — tornar público uma vez basta.

on:
  workflow_dispatch:

permissions: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico e publicação dos cinco pacotes
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
        run: |
          set -uo pipefail
          echo "token user: $(gh api /user --jq .login 2>&1 || true)"
          echo "pacotes visíveis para o token:"
          gh api '/user/packages?package_type=container' --jq '.[].name' 2>&1 || true

          falhas=0
          for pkg in nexus nexus-worker nexus-scheduler nexus-fiscal-sidecar nexus-mercos; do
            echo "::group::${pkg}"
            achou=0
            for base in "user" "users/spiesdan" "orgs/spiesdan"; do
              if gh api --method PATCH "${base}/packages/container/${pkg}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -f visibility=public >/dev/null 2>/tmp/gh-api-err; then
                echo "publicado via ${base}"
                achou=1
                break
              else
                echo "${base}: $(tr '\n' ' ' </tmp/gh-api-err)"
              fi
            done
            if [ "$achou" = 0 ]; then
              falhas=$((falhas + 1))
            else
              gh api "user/packages/container/${pkg}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --jq '.visibility' 2>&1 || true
            fi
            echo "::endgroup::"
          done
          echo "falhas=${falhas}"
          [ "$falhas" = 0 ]
