name: ci

on:
  pull_request:
  push:
    branches: [main]

# NEXUS 2.0 §73: cancela commits antigos do mesmo ref (não desperdiça runner
# com A/B/C quando D é o estado atual).
concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

# O GITHUB_TOKEN destes jobs serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público) —
# `contents: read` cobre os dois, que é o escopo que o próprio modelo de dados do
# CodeQL prescreve para essas duas actions. O `cache: pnpm` NÃO usa este token
# (usa ACTIONS_RUNTIME_TOKEN), `pnpm/action-setup` não tem input de token, e
# nenhum passo `run:` enxerga o token — ele só entra no ambiente via
# `secrets.GITHUB_TOKEN`, que não aparece em nenhum destes workflows.
#
# No topo, e não por job, porque os dois jobs precisam do mesmo escopo e job
# acrescentado depois nasce restrito em vez de herdar o default do repositório.
# Esse default hoje é `read` (medido em actions/permissions/workflow), então isto
# não corrige vazamento em vigor: tira a garantia de uma configuração que muda
# fora do repo, num clique, sem PR e sem deixar rastro aqui. `packages: write`
# continua por job em publish-image.yml — mesma regra, menor escopo que precisa.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 25, não 15. Medido em 18/11/2026: com o grupo de dependências do #455,
    # o verify da `main` levou 14m33s no PR (873 s) e passou dos 15 min no merge,
    # sendo CANCELADO pelo timeout — não por teste vermelho. Um job cancelado é
    # check vermelho para a branch protection, então a folga aqui não esconde
    # regressão: ela impede que uma suíte que passa seja reprovada pelo relógio.
    # Se voltar a encostar no teto, o conserto é fatiar `test:unit`, não subir de novo.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        run: pnpm lint:channels

      - name: Unit tests
        run: pnpm test:unit


      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      #
      # Desde 2026-08-08 inclui `hostgator-setup-kit/test-validators.sh`, os 163
      # casos que cobrem o install.sh. Eles existiam e NÃO rodavam em job nenhum
      # (issue #191): dois defeitos que tornavam a instalação impossível —
      # escolher OpenRouter travava o instalador num laço, escolher OpenAI
      # deixava o .env pela metade — passaram por todos os checks verdes. 15s.
      - name: Kit self-host (bash)
        run: pnpm test:shell

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # scripts/test-db.sh sobe pgvector/pgvector:pg17, aplica supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: RLS isolation + governance invariants
        run: pnpm test:db

  # ---------------------------------------------------------------------------
  # FRAGMENTO DE VERSÃO — o gate que faltava onde dói.
  #
  # Três vezes em dois dias o mesmo padrão: PR com código entra, `.changes/`
  # fica vazio, e a **release** falha lá na frente com "nenhum fragmento: não há
  # versão a cortar". O erro aparece no pior lugar — depois do merge, no
  # fechamento da versão — e o conserto custa um PR extra só de fragmento.
  #
  # Aqui ele aparece no PR, com o nome do arquivo que falta.
  #
  # O que NÃO exige fragmento: mudança só de documentação, de `.changes/` ou de
  # CI. E o PR de release (`release/*`) fica de fora por construção — ele CONSOME
  # fragmentos, não declara versão.
  # ---------------------------------------------------------------------------
  fragmento:
    if: >
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release/') &&
      !contains(github.event.pull_request.labels.*.name, 'sem-fragmento')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Todo PR que muda código declara a versão
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          MUDADOS=$(git diff --name-only "origin/$BASE...HEAD")

          CODIGO=$(printf '%s\n' "$MUDADOS" | grep -cE '^(app|lib|workers|components|supabase|scripts)/' || true)
          FRAGMENTOS=$(printf '%s\n' "$MUDADOS" | grep -cE '^\.changes/[^/]+\.md$' || true)

          echo "arquivos de código alterados: $CODIGO"
          echo "fragmentos em .changes/:       $FRAGMENTOS"

          if [ "$CODIGO" -eq 0 ]; then
            echo "Só documentação/CI — não precisa de fragmento."
            exit 0
          fi

          if [ "$FRAGMENTOS" -eq 0 ]; then
            echo "::error::Este PR muda código e não traz fragmento em .changes/."
            echo "Crie '.changes/<slug>.md' com:"
            echo "---"
            echo "impacto: nada_mudou | exige_acao | perda_de_funcao"
            echo "secao: adicionado | alterado | corrigido | removido | seguranca"
            echo "titulo: uma linha, no vocabulário de quem usa"
            echo "---"
            echo "e o texto do que muda. Ver docs/doctrine/versionamento.md."
            echo "Mudança que não deve gerar versão (raro): rótulo 'sem-fragmento' no PR, com o motivo no corpo."
            exit 1
          fi

          echo "Fragmento presente — a release vai conseguir cortar versão."
