name: discord-release

# A regra é simples e passou a ser automática: **toda tag publicada vira um
# post no Discord**. Antes isso dependia de alguém lembrar de rodar o script
# local — e quando ninguém lembrava, a versão subia calada. Agora a tag é o
# gatilho: se saiu release, o canal sabe.
#
# O webhook é secret de repositório (`DISCORD_WEBHOOK_URL`) e nunca é impresso.
#
# ## O que este workflow já errou (e por que cada linha está assim)
#
# 1. **Não existia**: 1.72.1 e 2.0.0 subiram caladas.
# 2. **Heredoc no `GITHUB_OUTPUT`**: a seção do CHANGELOG não termina com
#    quebra de linha, o `echo "FIM"` colou no conteúdo e o job morreu com
#    `Matching delimiter not found 'FIM'`. Agora a mensagem vai por ARQUIVO.
# 3. **`urllib` do Python**: devolveu `HTTP 403 Forbidden` do Discord no runner
#    do Actions (o mesmo webhook responde 204 de fora). Por isso o POST é por
#    `curl`, com User-Agent declarado — e o corpo da resposta é impresso, porque
#    "403" sem corpo não se diagnostica.
#
# Falha aqui NÃO derruba a release: este workflow é independente do
# `release.yml`/`publish-image.yml`. Ele falha em VERMELHO de propósito — aviso
# que falha calado foi exatamente o que nos custou três versões sem post.

on:
  push:
    tags: ["v*"]
  # Diagnóstico sem publicar: imprime a mensagem e confere o webhook com GET.
  # Existe porque testar o aviso exigia cortar uma release de verdade.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a simular (ex.: v2.0.3)"
        required: false
        default: ""
      postar:
        description: "Postar de verdade no canal?"
        type: choice
        options: ["nao", "sim"]
        default: "nao"

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Montar a mensagem a partir do CHANGELOG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # `inputs.postar` é VAZIO quando o gatilho é a tag. Sem o `|| 'sim'`,
          # `${POSTAR:-nao}` caía no dry-run e a v2.0.4 subiu sem post — o mesmo
          # silêncio de antes, agora por default errado. Tag posta; só o disparo
          # manual escolhe `nao`.
          POSTAR: ${{ inputs.postar || 'sim' }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const v = process.env.TAG.replace(/^v/, "");
            const texto = fs.readFileSync("CHANGELOG.md", "utf8");
            const i = texto.indexOf(`## [${v}]`);
            if (i < 0) { fs.writeFileSync("/tmp/msg.txt", `**NEXUS ${process.env.TAG}** publicado.`); process.exit(0); }
            const fim = texto.indexOf("\n## [", i + 5);
            const secao = texto.slice(i, fim > 0 ? fim : undefined).trim();
            fs.writeFileSync("/tmp/msg.txt", secao.slice(0, 1800));
          '
          echo "mensagem montada: $(wc -c < /tmp/msg.txt) bytes"
          if [ "${POSTAR:-nao}" != "sim" ]; then
            echo "--- dry-run (postar=nao) ---"
            head -c 400 /tmp/msg.txt; echo
          fi

      - name: Postar no Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POSTAR: ${{ inputs.postar || 'sim' }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "sem webhook configurado — nada a postar (instalação de cliente não precisa de aviso)"
            exit 0
          fi

          # Corpo em JSON montado por node: escapar markdown/quotes à mão é como
          # se perde mensagem. 1900 deixa margem para o limite de 2000.
          node -e '
            const fs = require("node:fs");
            const corpo = fs.readFileSync("/tmp/msg.txt", "utf8").trim().slice(0, 1900);
            if (!corpo) { console.log("mensagem vazia"); process.exit(3); }
            fs.writeFileSync("/tmp/payload.json", JSON.stringify({ content: corpo }));
          '

          if [ "${POSTAR:-nao}" != "sim" ]; then
            # Sem postar: o GET prova que o webhook existe e está ativo, sem
            # poluir o canal. Era o pedaço que faltava no diagnóstico.
            printf 'webhook: '
            curl -sS -m 15 -o /tmp/wh.json -w '%{http_code}\n' "$WEBHOOK"
            node -e 'const d=require("/tmp/wh.json"); console.log("canal:", d.name || "(sem nome)", "id:", d.channel_id || "?");' || true
            exit 0
          fi

          CODIGO="$(curl -sS -m 20 -o /tmp/resposta.txt -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -H "User-Agent: nexus-ci (https://github.com/spiesdan/nexus)" \
            -d @/tmp/payload.json "$WEBHOOK")"
          echo "discord: HTTP $CODIGO"
          if [ "$CODIGO" -lt 200 ] || [ "$CODIGO" -ge 300 ]; then
            # Corpo da resposta é o que diz o motivo (token inválido, canal
            # removido, rate limit). Imprimir e falhar — vermelho é o sinal.
            head -c 600 /tmp/resposta.txt || true
            echo
            exit 1
          fi
